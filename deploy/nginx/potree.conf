# Potree viewer + project portal — nginx site for /mnt/Data2/potree on :8080
# (:8081, the port used from 2026-10-06 to 2026-10-07, redirects to it).
#
# Install as /etc/nginx/sites-available/potree (already symlinked from
# sites-enabled); see deploy/README.md for the exact commands and rollback.
# The file is included inside the http {} block of /etc/nginx/nginx.conf,
# which is why the map below may live outside the server block.
#
# URL map
#   /                     302 -> /projects/ (project portal)
#   /projects/            portal (projects/index.html)
#   /projects/<id>/       project viewer page (projects/<id>/index.html)
#   /examples/            official Potree examples (examples/page.html)
#   /api/...              project service (server/project-server.mjs) on 127.0.0.1:8090;
#                         creating/editing needs the service's API token
#   everything else       static files from the repo, with directory listings


# Legacy hand-written pages (now in archive/legacy-pages/) -> new project pages.
# Matched against the decoded, normalised $uri (so "%20" arrives as a space);
# string keys of a map are compared case-insensitively.
map $uri $potree_legacy_target {
	default                                  "";

	/projects/Arolla.html                    /projects/arolla/;
	/projects/Arolla_prediction.html         /projects/arolla/;
	/projects/Grandsons.html                 /projects/grandson/;
	/projects/Grandsons_ransac.html          /projects/grandson/;
	/projects/Grandsons_prediction.html      /projects/grandson/;
	/projects/neuchatel.html                 /projects/neuchatel/;
	/projects/ollon_idw.html                 /projects/ollon-idw/;
	/projects/streetview_ne.html             /projects/streetview-ne/;
	/projects/valais.html                    /projects/valais/;
	/projects/vevey.html                     /projects/vevey/;
	/projects/NeoCapture.html                /projects/neocapture-voiteur/;
	"/projects/NeoCapture copy.html"         /projects/neocapture-voiteur/;

	/examples/Arolla.html                    /projects/arolla/;
	/examples/Arolla_prediction.html         /projects/arolla/;
	/examples/Grandsons.html                 /projects/grandson/;
	/examples/Grandsons_ransac.html          /projects/grandson/;
	/examples/Grandsons_prediction.html      /projects/grandson/;
	/examples/vevey.html                     /projects/vevey/;

	# Folder URLs without the trailing slash (sub-paths: see the locations).
	/examples/autoinspect                    /projects/autoinspect/;
	/examples/Potree_conv                    /projects/autoinspect/pointclouds/classes/;

	# Prediction projects merged into their ground-truth project on 2026-10-07
	# (the prediction is now a second, initially hidden point cloud there).
	/projects/arolla-prediction              /projects/arolla/;
	/projects/grandson-prediction            /projects/grandson/;
}

server {
	listen 8080;
	server_name _;

	root /mnt/Data2/potree;
	index index.html page.html;

	access_log /var/log/nginx/potree.access.log;
	error_log  /var/log/nginx/potree.error.log;

	# Emit relative Location headers so redirects keep working behind SSH
	# tunnels / port forwards (the absolute form would use the listen port).
	absolute_redirect off;

	# Browsable data folders (point clouds, panoramas, labels, ...).
	autoindex on;
	autoindex_exact_size on;
	autoindex_localtime on;

	# Compress text only. Binary point-cloud data (octree.bin, *.laz, *.gpkg)
	# is deliberately excluded: gzip would disable HTTP Range requests.
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml text/javascript
	           application/javascript application/json application/xml
	           image/svg+xml;

	# Old page URLs -> /projects/<id>/ (query string preserved).
	if ($potree_legacy_target) {
		return 301 $potree_legacy_target$is_args$args;
	}

	location = / {
		return 302 /projects/;
	}

	# Old autoinspect locations (moved to projects/autoinspect/). The drone
	# photos and camera files were moved one level down, into images/; that
	# rule must come before the generic one (the first matching rewrite wins).
	location ^~ /examples/autoinspect/ {
		rewrite "^/examples/autoinspect/(DJI_[^/]+\.JPG|camerat1z8\.txt|ParamCam\.xml|cam_t1z8_xml\.xml)$"
		        /projects/autoinspect/images/$1 permanent;
		rewrite ^/examples/autoinspect/(.*)$ /projects/autoinspect/$1 permanent;
	}
	location ^~ /projects/arolla-prediction/ {
		return 301 /projects/arolla/$is_args$args;
	}
	location ^~ /projects/grandson-prediction/ {
		return 301 /projects/grandson/$is_args$args;
	}
	location ^~ /examples/Potree_conv/ {
		rewrite ^/examples/Potree_conv/(.*)$ /projects/autoinspect/pointclouds/classes/$1 permanent;
	}

	# Project service API (keeps the /api prefix).
	#
	# Access control is done by the service itself: every request that changes
	# something, and every folder listing / job query, needs its API token
	# ("Authorization: Bearer <token>", from API_TOKEN in
	# /etc/potree-projects.env; see deploy/README.md "Access control"). Reading
	# the project list stays open so the portal works for everyone. nginx
	# forwards the Authorization / X-Api-Token headers unchanged.
	location ^~ /api/ {
		# Optional network allow-list on top of the token (defence in depth).
		# Uncomment to let only the listed hosts/subnets reach the API; others
		# get 403 and the portal falls back to read-only browsing from
		# projects/registry.json. Keep the ranges narrow: 10.0.0.0/8 would
		# cover every network this host is on.
		#allow 127.0.0.1;
		#allow 10.190.169.0/24;
		#deny  all;

		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_buffering off;
		client_max_body_size 1m;
	}

	# --- Not served -------------------------------------------------------
	# Regex locations are tried in order; these two must stay first.

	# Dot-files and dot-folders anywhere: .git, .vscode, .gitignore,
	# projects/.staging (work dirs), projects/.jobs (job state/logs), ...
	location ~ /\. {
		return 404;
	}

	# Service code, deployment files, archived pages and npm packages.
	location ~ ^/(server|deploy|archive|node_modules)(/|$) {
		return 404;
	}

	# --- Caching ----------------------------------------------------------

	# Shared project-page runtime (projects/shared/: project-viewer.js,
	# crs.js) and the portal (projects/portal/: ES modules + portal.css) are
	# imported by unversioned URLs and must always match the no-cache pages,
	# project.json files and the /api they talk to: revalidate them on every
	# use (cheap 304s via ETag). A regex location, not ^~, so that the deny
	# rules above (tried first) still apply to these folders.
	location ~ ^/projects/(shared|portal)/ {
		add_header Cache-Control "no-cache";
	}

	# Revalidate on every use (cheap 304s thanks to ETag / Last-Modified):
	# pages (the portal, the generated /projects/<id>/index.html pages, also
	# when reached as /projects/<id>/ through "index"), manifests
	# (project.json, registry.json, metadata.json, layers.json, ...) and the
	# PotreeConverter 2 octree files, which can be regenerated in place and
	# must never be mixed with stale cached copies.
	location ~* (\.html?|\.json|/hierarchy\.bin|/octree\.bin)$ {
		add_header Cache-Control "no-cache";
	}

	# Viewer code and third-party libraries: short cache, then revalidate.
	location /build/ {
		add_header Cache-Control "public, max-age=3600";
	}
	location /libs/ {
		add_header Cache-Control "public, max-age=3600";
	}

	location = /favicon.ico {
		log_not_found off;
	}

	# Everything else: plain static files (Range requests supported) with
	# default heuristic caching, directory listings as configured above.
	location / {
	}
}

# The site moved from :8081 to :8080 on 2026-10-07; keep links shared in the
# meantime working. Remove this block once nobody uses :8081 any more.
server {
	listen 8081;
	server_name _;
	access_log /var/log/nginx/potree.access.log;
	error_log  /var/log/nginx/potree.error.log;
	return 301 $scheme://$host:8080$request_uri;
}
