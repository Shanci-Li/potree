<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');">
		</div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script type="module">

		import * as THREE from "../libs/three.js/build/three.module.js";
		import {PLYLoader} from "../libs/three.js/loaders/PLYLoader.js";

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(5_000_000);
		viewer.loadSettingsFromURL();

		viewer.setDescription("");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			//$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_scene").next().show();
			$("#menu_filters").next().show();
			viewer.toggleSidebar();
		});

		Potree.loadPointCloud("https://storage-kubernetes.iict-heig-vd.in:9000/nearai/data/acquisitions/20251210-NeoCapture/06_point_clouds/potree/metadata.json", "neocapture", async function (e) {
			viewer.scene.addPointCloud(e.pointcloud);
			let material = e.pointcloud.material;
			material.size = 0.7;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.activeAttributeName = "rgba";
			viewer.fitToScreen();

			run();

		});

	async function run() {
		proj4.defs("EPSG:2154","+proj=lcc +lat_0=46.5 +lon_0=3 +lat_1=49 +lat_2=44 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs");
		proj4.defs("pointcloud", viewer.getProjection());

		// --- Configure 360° URLs here (edit this file; not editable in the browser) ---
		// coordinates.txt is loaded from: IMAGES_BASE_URL + "/coordinates.txt"
		// Each row's File column is relative to IMAGES_BASE_URL.
		// If LABELS_BASE_URL is non-empty, labels use the same relative paths under that base.
		const IMAGES_BASE_URL = "https://storage-kubernetes.iict-heig-vd.in:9000/nearai/data/acquisitions/20251210-NeoCapture/01_images";
		const LABELS_BASE_URL = ""; // optional, e.g. ".../01_labels"

		const imagesBaseUrl = IMAGES_BASE_URL.trim();
		if (!imagesBaseUrl) {
			console.error("Set IMAGES_BASE_URL in NeoCapture.html (coordinates.txt + File paths are relative to it).");
			viewer.mapView.showSources(true);
			return;
		}

		let params = {
			transform: { forward: a => a },
			coordinatesFile: "coordinates.txt",
			labelsBaseUrl: LABELS_BASE_URL.trim() || undefined,
		};

		try {
			const images360 = await Potree.Images360Loader.load(imagesBaseUrl, viewer, params);
			viewer.scene.add360Images(images360);
			console.log(`✓ Loaded ${images360.images.length} 360° images`);
		} catch (error) {
			console.error("✗ Error loading 360 images:", error);
		}

		viewer.mapView.showSources(true);
	}


	</script>
</body>

</html>
