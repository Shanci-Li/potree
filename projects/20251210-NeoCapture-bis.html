	async function run() {
		proj4.defs("EPSG:2154","+proj=lcc +lat_0=46.5 +lon_0=3 +lat_1=49 +lat_2=44 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs");
		proj4.defs("pointcloud", viewer.getProjection());

		// --- Configure 360° URLs here (edit this file; not editable in the browser) ---
		// coordinates.txt is loaded from: IMAGES_BASE_URL + "/coordinates.txt"
		// Each row's File column is relative to IMAGES_BASE_URL.
		// If LABELS_BASE_URL is non-empty, labels use the same relative paths under that base.
		const IMAGES_BASE_URL = "https://storage-kubernetes.iict-heig-vd.in:9000/nearai/data/acquisitions/20251210-NeoCapture-bis/01_images";
		const LABELS_BASE_URL = ""; // optional, e.g. ".../01_labels"

		const imagesBaseUrl = IMAGES_BASE_URL.trim();
		if (!imagesBaseUrl) {
			console.error("Set IMAGES_BASE_URL in NeoCapture.html (coordinates.txt + File paths are relative to it).");
			viewer.mapView.showSources(true);
			return;
		}

		let params = {
			transform: { forward: a => a },
			coordinatesFile: "coordinates.txt",
			labelsBaseUrl: LABELS_BASE_URL.trim() || undefined,
		};

		try {
			const images360 = await Potree.Images360Loader.load(imagesBaseUrl, viewer, params);
			viewer.scene.add360Images(images360);
			console.log(`✓ Loaded ${images360.images.length} 360° images`);
		} catch (error) {
			console.error("✗ Error loading 360 images:", error);
		}

		viewer.mapView.showSources(true);
	}
