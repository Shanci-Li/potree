	#potree_toolbar {
		position: absolute; 
		z-index: 10000; 
		right: 0px; 
		top: 200px;
		background: rgba(119, 13, 13, 0);
		color: rgb(255, 255, 255);
		padding: 0.3em 0.8em;
		font-family: "system-ui";
		border-radius: 0.3em;
		display: flex;
		flex-direction: column;
		align-items: center;
	}

	.potree_toolbar_item {
		display: flex;
		align-items: center;
		margin-bottom: 30px;
		position: relative; 
	}

	.potree_toolbar_label {
		position: absolute;
		left: -60px; 
		writing-mode: vertical-rl;
		transform: rotate(180deg);
		font-size: smaller;
		opacity: 0.9;
		white-space: nowrap;
	}

	.potree_button {
		width: 100px;
		padding: 10px;
		background-color: rgba(163, 24, 24, 0.043);
		border-radius: 0.3em;
		color: white;
		display: flex;
		flex-direction: column; 
		align-items: center;
	}
	.icon {
		margin: 5px 0;
	}

		
	.potree_button img.icon-normal {
		opacity: 1;
		filter: none;
	}

	
	.potree_button img.icon-disabled {
		opacity: 0.3; 
		filter: grayscale(100%);

		
	}

	#footer-rectangle {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.5); /* Couleur noire transparente */
            color: white; /* Couleur du texte */

            line-height: 50px; /* Centrer verticalement le texte */

		let visiblePointcloudsCount = 0;

		function toggleVisibilityAndIcon(pointcloudName, buttonName) {
			elToolbar.find(`img[name=${buttonName}]`).click(() => {
				let pointcloudFound = false;

				// Bascule la visibilité du pointcloud avec le nom spécifié
				viewer.scene.pointclouds.forEach(pointcloud => {
					if (pointcloud.name === pointcloudName) {
						pointcloud.visible = !pointcloud.visible;
						pointcloudFound = true;

						// Si le pointcloud est visible, incrémente le compteur, sinon décrémente
						if (pointcloud.visible) {
							visiblePointcloudsCount++;
						} else {
							visiblePointcloudsCount--;
						}
					}
				});

				// Si le pointcloud est trouvé, mettre à jour l'icône et le rectangle
				if (pointcloudFound) {
					const buttonIcon = elToolbar.find(`img[name=${buttonName}]`);
					const pointcloud = viewer.scene.pointclouds.find(p => p.name === pointcloudName);

					if (pointcloud && pointcloud.visible) {
						// Si visible, afficher l'icône normale
						buttonIcon.removeClass("icon-disabled");
						buttonIcon.addClass("icon-normal");
					} else {
						// Si invisible, désactiver l'icône
						buttonIcon.removeClass("icon-normal");
						buttonIcon.addClass("icon-disabled");
					}

					// Si au moins un pointcloud est visible, afficher le rectangle
